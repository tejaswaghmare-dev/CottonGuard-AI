<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Shield -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>

    <!-- Leaf & Accent Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#81C784" />
    </linearGradient>

    <!-- AI Tech Circuit Gradient -->
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(15, 10)">
    <!-- Protective Outer Shield -->
    <path d="M 100,15 
             C 145,15 175,25 175,25 
             C 175,105 140,155 100,185 
             C 60,155 25,105 25,25 
             C 25,25 55,15 100,15 Z" 
          fill="url(#shieldGrad)" 
          filter="url(#shadow)" />

    <!-- AI Circuit Overlay Lines inside Shield -->
    <path d="M 50,60 L 75,60 L 90,80 M 150,60 L 125,60 L 110,80 M 100,185 L 100,150" 
          stroke="url(#techGrad)" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.6" />
    <circle cx="75" cy="60" r="3.5" fill="#00E676" />
    <circle cx="125" cy="60" r="3.5" fill="#00E676" />
    <circle cx="90" cy="80" r="3.5" fill="#00B0FF" />
    <circle cx="110" cy="80" r="3.5" fill="#00B0FF" />

    <!-- Stylized Cotton Boll (White & Soft Gray Base) -->
    <g filter="url(#shadow)">
      <!-- Cotton Fluff Petals -->
      <path d="M 72,105 C 60,90 70,70 85,72 C 90,60 110,60 115,72 C 130,70 140,90 128,105 C 140,120 125,138 108,135 C 92,138 77,120 72,105 Z" 
            fill="#FFFFFF" />
      <path d="M 85,82 C 95,85 105,82 115,82 C 120,95 115,110 100,120 C 85,110 80,95 85,82 Z" 
            fill="#F0F4F1" opacity="0.5" />
      
      <!-- Sepal/Base Leaves supporting the Cotton -->
      <path d="M 100,140 C 90,130 75,128 68,122 C 78,120 90,122 100,128 C 110,122 122,120 132,122 C 125,128 110,130 100,140 Z" 
            fill="#2E7D32" />
    </g>

    <!-- AI Leaf (Crop Health & Scan Motif) -->
    <path d="M 100,75 C 125,75 145,95 140,125 C 120,125 100,110 100,75 Z" 
          fill="url(#leafGrad)" />
    <!-- Leaf Center Vein / Tech Line -->
    <path d="M 100,75 C 110,95 125,110 138,118" 
          stroke="#FFFFFF" 
          stroke-width="2" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.8" />
  </g>

  <!-- TEXT BRANDING GROUP -->
  <g transform="translate(210, 115)">
    <!-- Brand Name: CottonGuard -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="42" 
          font-weight="800" 
          fill="#1B5E20" 
          letter-spacing="-0.5">CottonGuard</text>

    <!-- Brand Subhead / Tagline: -AI with Tech Badge -->
    <g transform="translate(275, -34)">
      <rect x="0" y="0" width="65" height="36" rx="8" fill="url(#techGrad)" />
      <text x="32.5" y="24" 
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="20" 
            font-weight="900" 
            fill="#FFFFFF" 
            text-anchor="middle" 
            letter-spacing="0.5">AI</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="2" y="30" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="15" 
          font-weight="600" 
          fill="#558B2F" 
          letter-spacing="1.5">SMART CROP PROTECTION</text>
  </g>
</svg>
